name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# e2e boots a MikroTik CHR router under KVM in containerlab, from an image
# downloaded from MikroTik and built on the runner with vrnetlab. Nothing is
# pushed or uploaded.
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: |
          touch id_ed25519.pub
          conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    name: e2e (chr-7.25.1)
    timeout-minutes: 30
    env:
      CLAB_VERSION: 0.82.0
      CLAB_SHA256: 770e18f19ef75732eb9f4e362541f509abb2b6eeadde2d5c98140190b19b519a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: *gh
        run: *install
      # Hosted Ubuntu runners have KVM, but /dev/kvm isn't open to the
      # runner user until a udev rule says so.
      - name: Open up KVM, install containerlab and snmpget
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          cd "$RUNNER_TEMP"
          deb="containerlab_${CLAB_VERSION}_linux_amd64.deb"
          curl -sSfLO "https://github.com/srl-labs/containerlab/releases/download/v${CLAB_VERSION}/$deb"
          echo "$CLAB_SHA256  $deb" | sha256sum -c -
          sudo apt-get update -q
          sudo apt-get install -y -q "./$deb" snmp
      - name: Start the lab router
        working-directory: examples/local
        run: ./up.sh
      # Apply with the provider release before the pinned one first, then
      # move to the pin, as anyone upgrading this circuit does.
      - name: Apply with the previous provider release, 1.99.0
        working-directory: examples/local
        run: |
          sed -i 's/version = "1.99.1"/version = "1.99.0"/' ../../versions.tf
          conn3x init
          conn3x apply -auto-approve
      - name: Upgrade to the pinned provider, apply, then plan again with no changes
        working-directory: examples/local
        run: |
          git checkout -- ../../versions.tf
          conn3x init -upgrade
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Use the router
        working-directory: examples/local
        run: ./check.sh
      - name: Check the passwords stayed out of state
        working-directory: examples/local
        run: |
          val() { sed -n "s/^$1 *= \"\(.*\)\"$/\1/p" lab.auto.tfvars; }
          for v in admin_password ops_password snmp_auth_password snmp_priv_password; do
            [ -n "$(val $v)" ]
            if grep -qF "$(val $v)" terraform.tfstate; then echo "$v is in the state." >&2; exit 1; fi
          done
      - name: Change the router by hand, and see drift
        working-directory: examples/local
        run: |
          val() { sed -n "s/^$1 *= \"\(.*\)\"$/\1/p" lab.auto.tfvars; }
          printf 'user = "admin:%s"\n' "$(val admin_password)" |
            curl -sSf -o /dev/null -K - -H 'Content-Type: application/json' -d '{"name":"changed-by-hand"}' "http://$(val host)/rest/system/identity/set"
          rc=0
          conn3x drift || rc=$?
          [ "$rc" -eq 2 ] || { echo "drift exited $rc, not 2." >&2; exit 1; }
      - name: Apply again, then plan with no changes
        working-directory: examples/local
        run: |
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Show the router's console
        if: failure()
        run: docker logs --tail 100 clab-routeros-r1 || true
      - name: Clean up
        if: always()
        working-directory: examples/local
        run: ./down.sh
